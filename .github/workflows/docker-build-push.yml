name: Build, Push and Deploy ThingsBoard Images

on:
  push:
    branches:
      - feature
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
      image_identified: ${{ steps.identify-image.outputs.image_found }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for semantic versioning to work properly
      - name: Clean Docker space
        run: |
          docker system df
          docker system prune -af --volumes    

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Semantic versioning
        id: versioning
        uses: paulhatch/semantic-version@v5.0.2
        with: 
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE|major):"
          minor_pattern: "(feat|minor):"
          patch_pattern: "(fix|patch|chore):"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true

      - name: Verify version
        run: |
          if [ -z "${{ steps.versioning.outputs.version }}" ]; then
            echo "Version generation failed!"
            exit 1
          fi
          echo "Using version: ${{ steps.versioning.outputs.version }}"

      - name: Build project with Maven
        run: mvn clean install -DskipTests -Dlicense.skip=true -Ddockerfile.skip=false

      - name: List built images
        run: docker image ls --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Identify ThingsBoard node image
        id: identify-image
        run: |
          # Try to find tb-node image first, fall back to thingsboard image
          NODE_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "tb-node:" | head -1)
          
          if [ -z "$NODE_IMAGE" ]; then
            # Fallback to the main thingsboard image
            NODE_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "thingsboard:" | grep -v "thingsboard-web-ui" | head -1)
            echo "Using fallback image: $NODE_IMAGE"
          else
            echo "Found tb-node image: $NODE_IMAGE"
          fi
          
          if [ -z "$NODE_IMAGE" ]; then
            echo "ERROR: Could not find ThingsBoard node image!"
            docker images
            echo "image_found=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "image_found=true" >> $GITHUB_OUTPUT
          echo "NODE_IMAGE=$NODE_IMAGE" >> $GITHUB_ENV

      - name: Push Docker Images
        if: steps.identify-image.outputs.image_found == 'true'
        run: |
          VERSION=${{ steps.versioning.outputs.version }}
          USERNAME="cain12"
          
          # Get all non-dangling images
          IMAGES_WITH_TAGS=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>")
          
          if [ -z "$IMAGES_WITH_TAGS" ]; then
            echo "Error: No Docker images found!"
            exit 1
          fi

          for IMAGE_WITH_TAG in $IMAGES_WITH_TAGS; do
            # Skip if already tagged with version
            if [[ $IMAGE_WITH_TAG == *"$VERSION" ]]; then
              continue
            fi
            
            ORIG_REPO=$(echo $IMAGE_WITH_TAG | cut -d':' -f1)
            IMAGE_NAME=$(basename $ORIG_REPO)
            NEW_REPO="$USERNAME/$IMAGE_NAME"
            
            echo "Processing $IMAGE_WITH_TAG → $NEW_REPO:$VERSION"
            
            docker tag $IMAGE_WITH_TAG $NEW_REPO:$VERSION
            docker push $NEW_REPO:$VERSION || echo "Failed to push $NEW_REPO:$VERSION"
            
            docker tag $IMAGE_WITH_TAG $NEW_REPO:latest
            docker push $NEW_REPO:latest || echo "Failed to push $NEW_REPO:latest"
          done

      - name: Upload deployment artifacts
        if: steps.identify-image.outputs.image_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: |
            VERSION.txt
            NODE_IMAGE.txt
          retention-days: 1

      - name: Create version files
        if: steps.identify-image.outputs.image_found == 'true'
        run: |
          echo "${{ steps.versioning.outputs.version }}" > VERSION.txt
          echo "${{ env.NODE_IMAGE }}" > NODE_IMAGE.txt

  deploy-to-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.outputs.image_identified == 'true'
    steps:
      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          rm cloudflared-linux-amd64.deb
          cloudflared --version
      - name: Setup SSH Environment
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H gh.kabil-sobeam.info >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Read version and image info
        id: deployment
        run: |
          echo "VERSION=$(cat VERSION.txt)" >> $GITHUB_OUTPUT
          echo "NODE_IMAGE=$(cat NODE_IMAGE.txt)" >> $GITHUB_OUTPUT
          echo "Using version: $(cat VERSION.txt)"
          echo "Node image: $(cat NODE_IMAGE.txt)"

      - name: Generate docker-compose file
        run: |
          cat > docker-compose-dev.yml << "EOF"
          services:
            postgres:
              restart: always
              image: "postgres:16"
              ports:
                - "5432"
              environment:
                POSTGRES_DB: thingsboard
                POSTGRES_PASSWORD: postgres
              volumes:
                - postgres-data:/var/lib/postgresql/data
            thingsboard-ce:
              restart: always
              image: "cain12/tb-node:latest"
              ports:
                - "8080:8080"
                - "7070:7070"
                - "1883:1883"
                - "8883:8883"
                - "5683-5688:5683-5688/udp"
              logging:
                driver: "json-file"
                options:
                  max-size: "100m"
                  max-file: "10"
              environment:
                TB_SERVICE_ID: tb-ce-node
                SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
              depends_on:
                - postgres
          
          volumes:
            postgres-data:
              #name: tb-postgres-data
              #driver: local
              name: tb-postgres-data  # Use the existing volume name
              external: true 
          EOF

      - name: Deploy to development server
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          # Copy the docker-compose file
          scp -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ProxyCommand="cloudflared access ssh --hostname gh.kabil-sobeam.info" docker-compose-dev.yml tb@gh.kabil-sobeam.info:/opt/thingsboard-dev/docker-compose-dev.yml

          # Execute the deployment script on the remote server
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ProxyCommand="cloudflared access ssh --hostname gh.kabil-sobeam.info" tb@gh.kabil-sobeam.info '
          cd /opt/thingsboard-dev
          bash deploy.sh
          ' 
          
      - name: Verify deployment
        run: |
          sleep 30
          
          ssh -o StrictHostKeyChecking=no -o ProxyCommand="cloudflared access ssh --hostname gh.kabil-sobeam.info" tb@gh.kabil-sobeam.info << 'EOF'
          echo "Checking ThingsBoard health..."
          max_attempts=15
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if curl -f http://localhost:8080; then
              echo "ThingsBoard is healthy and responding!"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts failed. Retrying in 10 seconds..."
            sleep 10
            attempt=$((attempt+1))
          done
          echo "ThingsBoard failed to start after $max_attempts attempts"
          docker compose -f docker-compose-dev.yml logs thingsboard-ce
          exit 1
          EOF
