name: Build and Push ThingsBoard Images

on:
  push:
    branches:
      - develop   # Only run on develop branch pushes

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - name: Checkout source
        uses: actions/checkout@v4

      # Cache Maven dependencies (~/.m2/repository) to avoid re-downloading them each build
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Set up JDK 17 (required for ThingsBoard)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Set up Docker Buildx (supports advanced caching & multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache Docker build layers (faster rebuilds)
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Log in to DockerHub (secrets must be added in repo settings)
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Use semantic versioning based on commit messages
      - name: Semantic versioning
        id: versioning
        uses: paulhatch/semantic-version@v5.0.2
        with: 
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          version_format: "v${major}.${minor}.${patch}"
          bump_each_commit: true

      # Build project with Maven (skip tests & skip license check)
      - name: Build project with Maven
        run: mvn clean install -DskipTests -Dlicense.skip=true -Ddockerfile.skip=false

      # List Docker images built by Maven
      - name: List built images
        run: docker image ls | grep thingsboard || true

      # Tag and push Docker images with both :latest and semantic version tag
      - name: Push Docker Images
        run: |
          VERSION=${{ steps.versioning.outputs.version }}
          echo "Using version tag: $VERSION"

          # Find all ThingsBoard images built locally
          IMAGES=$(docker images --format "{{.Repository}}" | grep "thingsboard/" | sort -u)

          for IMAGE in $IMAGES; do
            echo "Pushing $IMAGE:$VERSION"
            docker tag $IMAGE:latest $IMAGE:$VERSION
            docker push $IMAGE:$VERSION
            docker push $IMAGE:latest
          done
