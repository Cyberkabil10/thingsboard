name: Build and Push ThingsBoard Images

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Semantic versioning
        id: versioning
        uses: paulhatch/semantic-version@v5.0.2
        with: 
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          version_format: "v${major}.${minor}.${patch}"
          bump_each_commit: true

      - name: Verify version
        run: |
          if [ -z "${{ steps.versioning.outputs.version }}" ]; then
            echo "Version generation failed!"
            exit 1
          fi
          echo "Using version: ${{ steps.versioning.outputs.version }}"

      - name: Build project with Maven
        run: mvn clean install -DskipTests -Dlicense.skip=true -Ddockerfile.skip=false

      - name: List built images
        run: docker image ls --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

      - name: Push Docker Images
        run: |
          VERSION=${{ steps.versioning.outputs.version }}
          USERNAME="cain12"
          
          # Get all non-dangling images
          IMAGES_WITH_TAGS=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>")
          
          if [ -z "$IMAGES_WITH_TAGS" ]; then
            echo "Error: No Docker images found!"
            exit 1
          fi

          for IMAGE_WITH_TAG in $IMAGES_WITH_TAGS; do
            # Skip if already tagged with version
            if [[ $IMAGE_WITH_TAG == *"$VERSION" ]]; then
              continue
            fi
            
            ORIG_REPO=$(echo $IMAGE_WITH_TAG | cut -d':' -f1)
            IMAGE_NAME=$(basename $ORIG_REPO)
            NEW_REPO="$USERNAME/$IMAGE_NAME"
            
            echo "Processing $IMAGE_WITH_TAG → $NEW_REPO:$VERSION"
            
            docker tag $IMAGE_WITH_TAG $NEW_REPO:$VERSION
            docker push $NEW_REPO:$VERSION || echo "Failed to push $NEW_REPO:$VERSION"
            
            docker tag $IMAGE_WITH_TAG $NEW_REPO:latest
            docker push $NEW_REPO:latest || echo "Failed to push $NEW_REPO:latest"
          done
  deploy-to-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-info
  
      - name: Read version and image info
        id: deployment
        run: |
          echo "VERSION=$(cat VERSION.txt)" >> $GITHUB_OUTPUT
          echo "NODE_IMAGE=$(cat NODE_IMAGE.txt)" >> $GITHUB_OUTPUT
          echo "Using version: $(cat VERSION.txt)"
          echo "Node image: $(cat NODE_IMAGE.txt)"
  
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
  
      - name: Generate docker-compose file (official style)
        run: |
          cat > docker-compose-dev.yml << EOF
          version: '3.8'
          services:
            postgres:
              restart: always
              image: "postgres:16"
              ports:
                - "5432"
              environment:
                POSTGRES_DB: thingsboard
                POSTGRES_PASSWORD: postgres
              volumes:
                - postgres-data:/var/lib/postgresql/data
                
            thingsboard-ce:
              restart: always
              image: cain12/tb-node:${{ steps.deployment.outputs.VERSION }}
              ports:
                - "8080:8080"
                - "7070:7070"
                - "1883:1883"
                - "8883:8883"
                - "5683-5688:5683-5688/udp"
              logging:
                driver: "json-file"
                options:
                  max-size: "100m"
                  max-file: "10"
              environment:
                TB_SERVICE_ID: tb-ce-node
                SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
                SPRING_DATASOURCE_USERNAME: postgres
                SPRING_DATASOURCE_PASSWORD: postgres
              depends_on:
                - postgres
              volumes:
                - thingsboard-data:/data
                - thingsboard-logs:/var/log/thingsboard
  
          volumes:
            postgres-data:
              name: tb-postgres-data
              driver: local
            thingsboard-data:
              name: tb-data
              driver: local
            thingsboard-logs:
              name: tb-logs
              driver: local
          EOF
  
          echo "Generated docker-compose file:"
          cat docker-compose-dev.yml
  
      - name: Deploy to development server
        env:
          SSH_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SSH_USER: ${{ secrets.DEV_SERVER_USER }}
          SSH_PORT: ${{ secrets.DEV_SERVER_PORT || '22' }}
        run: |
          # Create directory structure on server
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
            "mkdir -p /opt/thingsboard-dev"
  
          # Copy docker-compose file to server
          scp -P $SSH_PORT -o StrictHostKeyChecking=no docker-compose-dev.yml $SSH_USER@$SSH_HOST:/opt/thingsboard-dev/
  
          # SSH into server and deploy
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'EOF'
          cd /opt/thingsboard-dev
  
          # Pull latest images
          echo "Pulling latest images..."
          docker compose -f docker-compose-dev.yml pull
  
          # Stop and remove existing containers
          echo "Stopping existing containers..."
          docker compose -f docker-compose-dev.yml down
  
          # Start new containers
          echo "Starting new containers..."
          docker compose -f docker-compose-dev.yml up -d
  
          # Clean up old images
          echo "Cleaning up old images..."
          docker image prune -af
  
          # Check service status
          echo "Deployment completed. Checking service status..."
          docker compose -f docker-compose-dev.yml ps
          EOF
  
      - name: Verify deployment
        env:
          SSH_HOST: ${{ secrets.DEV_SERVER_HOST }}
          SSH_USER: ${{ secrets.DEV_SERVER_USER }}
          SSH_PORT: ${{ secrets.DEV_SERVER_PORT || '22' }}
        run: |
          # Wait for services to be healthy
          sleep 30
  
          # Check if ThingsBoard is responding
          ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'EOF'
          echo "Checking ThingsBoard health..."
          max_attempts=15
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if curl -f http://localhost:8080/api/auth/about; then
              echo "ThingsBoard is healthy and responding!"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts failed. Retrying in 10 seconds..."
            sleep 10
            attempt=$((attempt+1))
          done
          echo "ThingsBoard failed to start after $max_attempts attempts"
          docker compose -f docker-compose-dev.yml logs thingsboard-ce
          exit 1
          EOF
